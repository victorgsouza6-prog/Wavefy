<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wavefy - Músicas</title>

<link rel="stylesheet" href="CSS/home.css">
<link rel="stylesheet" href="CSS/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <img src="imagens/logo.png">
            <h2>Wavefy</h2>
        </div>

        <nav>

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <span>Início</span>
            </a>

            <a class="ativo">
                <i class="fa-solid fa-music"></i>
                <span>Músicas</span>
            </a>

            <a href="albuns.html">
                <i class="fa-solid fa-compact-disc"></i>
                <span>Álbuns</span>
            </a>

            <a href="artistas.html">
                <i class="fa-solid fa-user-group"></i>
                <span>Artistas</span>
            </a>

            <a href="favoritos.html">
                <i class="fa-solid fa-heart"></i>
                <span>Favoritos</span>
            </a>

            <a href="playlists.html">
                <i class="fa-solid fa-list"></i>
                <span>Playlists</span>
            </a>

        </nav>

    </aside>

    <main class="content">

        <header class="topbar">

            <h1>Todas as Músicas</h1>

            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Pesquisar música...">

            </div>

        </header>

        <section>

            <div class="cards" id="listaMusicas">

            </div>

        </section>

    </main>

</div>


<audio id="audio"></audio>

<!-- PLAYER -->

<footer class="player">

    <div class="player-left">

        <img id="capaPlayer" src="imagens/capas/veigh.jpg">

        <div>

            <h3 id="nomeMusica">Novo Balanço</h3>

            <p id="nomeArtista">VEIGH</p>

        </div>

    </div>

    <div class="player-center">

        <button id="anterior">
            <i class="fa-solid fa-backward-step"></i>
        </button>

        <button id="play">
            <i class="fa-solid fa-play"></i>
        </button>

        <button id="proximo">
            <i class="fa-solid fa-forward-step"></i>
        </button>

    </div>

    <div class="player-right">

        <span>00:00</span>

        <input
            type="range"
            id="volume"
            min="0"
            max="100"
            value="100">

    </div>

</footer>

<script src="JS/musicas.js"></script>
<script src="JS/player.js"></script>



</body>
</html>
