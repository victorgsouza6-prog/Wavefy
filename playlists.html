<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playlists - Wavefy</title>

    <link rel="stylesheet" href="CSS/home.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <main class="pagina-playlist">

        <div class="topo-playlist">

            <a href="index.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div>

                <p>PLAYLIST</p>

                <h1>Minha Playlist</h1>

                <span id="quantidadePlaylist">0 músicas</span>

            </div>

        </div>

        <div id="listaPlaylist" class="lista-playlist"></div>

    </main>


    <!-- PLAYER DA PLAYLIST -->

    <div class="player-playlist" id="playerPlaylist">

        <div class="player-musica-info">

            <img
                src="imagens/capas/padrao.jpg"
                id="playerCapa"
                alt="Capa da música"
            >

            <div>

                <h3 id="playerNome">Escolha uma música</h3>

                <p id="playerArtista">Wavefy</p>

            </div>

        </div>


        <div class="player-controles">

            <div class="botoes-player">

                <button type="button" onclick="musicaAnterior()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button
                    type="button"
                    class="botao-play-playlist"
                    id="botaoPlayPlaylist"
                    onclick="alternarPlay()"
                >
                    <i class="fa-solid fa-play"></i>
                </button>

                <button type="button" onclick="proximaMusica()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

            </div>


            <div class="barra-tempo">

                <span id="tempoAtual">0:00</span>

                <input
                    type="range"
                    id="progressoPlaylist"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duracaoPlaylist">00:00</span>

            </div>

        </div>


        <div class="volume-playlist">

            <i class="fa-solid fa-volume-high" id="iconeVolume"></i>

            <input
                type="range"
                id="volumePlaylist"
                min="0"
                max="100"
                value="100"
            >

        </div>

    </div>


    <audio id="audioPlaylist"></audio>

    <script src="JS/playlists.js"></script>

</body>

</html>
